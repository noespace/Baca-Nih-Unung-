<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5c2">
  <meta name="description" content="Ketupat untuk Khusnul — bukan sogokan jilid dua.">
  <title>Ketupat untuk Khusnul</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff5c2'/%3E%3Cpath d='M32 8 54 32 32 56 10 32Z' fill='%237fbf45' stroke='%232d3828' stroke-width='4'/%3E%3Cpath d='M20 21 44 43M44 21 20 43' stroke='%23fff1a3' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <article class="book" id="book" aria-live="polite">
      <div class="tape" aria-hidden="true"></div>
      <span class="doodle doodle-one" aria-hidden="true">✿</span>
      <span class="doodle doodle-two" aria-hidden="true">♡</span>

      <section class="slide active cover" id="cover">
        <div class="cover-copy">
          <p class="label">dokumen tidak resmi</p>
          <h1>KETUPAT<br>UNTUK KHUSNUL</h1>
          <p class="subtitle">(bukan sogokan jilid dua)</p>
          <p class="opening">Website ini dibuat karena ngomong langsung susah, jadi yaudah. Gue bikin beginian. Lagi.</p>
        </div>

        <button class="ketupat-button" id="openKetupat" aria-label="Buka ketupat dan mulai membaca">
          <img src="assets/ketupat.png" alt="Ilustrasi ketupat hijau dengan coretan hati kecil">
          <span>klik ketupatnya<br>ga ada malware kok</span>
        </button>
      </section>

      <section class="slide story-slide" id="storySlide">
        <div class="story-card">
          <p class="label" id="pageLabel"></p>
          <h2 id="pageTitle"></h2>
          <div class="story-body" id="pageBody"></div>
        </div>
      </section>

      <section class="slide ending" id="ending">
        <p class="label">keputusan sementara</p>
        <h2>TEMENAN YAAA?</h2>
        <p>Gue kangen temen gue. Udah jangan jutek mulu.</p>

        <div class="choices">
          <button class="choice" data-answer="yes">Yaudah iya deh, huuhh</button>
          <button class="choice secondary" data-answer="time">Masih kesel</button>
        </div>

        <div class="answer" id="answer" role="status"></div>
      </section>

      <nav class="controls" aria-label="Navigasi cerita">
        <button class="nav-button" id="prev" disabled>← balik</button>
        <div class="progress-area">
          <div class="progress"><span id="progressBar"></span></div>
          <span id="counter">0 / 10</span>
        </div>
        <button class="nav-button" id="next">lanjut →</button>
      </nav>
    </article>
  </main>

  <!-- Edit semua tulisan di content.js -->
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
